<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Mobile App -->
  <rect x="280" y="30" width="200" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Mobile App</text>
  <text x="380" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">WisataKu</text>

  <!-- Arrow Mobile -> Backend -->
  <line x1="380" y1="100" x2="380" y2="165" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333333">HTTP / REST API</text>

  <!-- NestJS Backend container -->
  <rect x="200" y="170" width="360" height="320" rx="12" ry="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="380" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">NestJS Backend</text>
  <text x="380" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">WisataKu</text>
  <text x="380" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5a4a10">Monolitik Modular</text>

  <!-- Modules box -->
  <rect x="280" y="265" width="200" height="200" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="380" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">Auth</text>
  <text x="380" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">User</text>
  <text x="380" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">Destinasi</text>
  <text x="380" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">Booking</text>
  <text x="380" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">Review</text>
  <text x="380" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">Admin</text>
  <text x="380" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#666666">(modul konseptual)</text>

  <!-- Web Admin -->
  <rect x="580" y="280" width="160" height="70" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="660" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Web Admin</text>
  <text x="660" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">WisataKu</text>

  <!-- Arrow Web Admin -> Backend -->
  <line x1="580" y1="315" x2="565" y2="315" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="300" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#333333">HTTP / REST API</text>

  <!-- Arrow Backend -> Database -->
  <line x1="380" y1="490" x2="380" y2="555" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333333">Data Access</text>

  <!-- Database cylinder -->
  <ellipse cx="380" cy="575" rx="80" ry="18" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <rect x="300" y="575" width="160" height="55" fill="#e1d5e7" stroke="none"/>
  <line x1="300" y1="575" x2="300" y2="630" stroke="#9673a6" stroke-width="2"/>
  <line x1="460" y1="575" x2="460" y2="630" stroke="#9673a6" stroke-width="2"/>
  <ellipse cx="380" cy="630" rx="80" ry="18" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="380" y="610" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Database</text>

  <!-- Note -->
  <text x="80" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666666">Client (Mobile &amp; Web Admin) mengakses NestJS melalui REST API.</text>
  <text x="80" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666666">Modul berada dalam satu aplikasi monolitik modular.</text>
</svg>
